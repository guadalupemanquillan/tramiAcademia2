<div class="card shadow-sm mx-4">
  <div class="card-header bg-primary-subtle text-primary-emphasis d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Videos</h5>
    <button *ngIf="authService.role === 'editor'" class="btn btn-brand" data-bs-toggle="modal"
      data-bs-target="#modalCrearVideo">Crear nuevo video</button>
  </div>
  <div class="card-body">
    <div class="d-flex align-items-center flex-wrap gap-2 mb-3">
      <select id="filtroCatVideo" class="form-select form-select-lg w-auto me-2" [(ngModel)]="categoriaSeleccionada">
        <option [ngValue]="null">Todas</option>
        <option *ngFor="let c of categorias" [ngValue]="c._id">{{ c.nombre }}</option>
      </select>
      <label class="form-label mb-0" for="filtroCatVideo">Filtrar por categoría</label>
    </div>

    <div class="table-responsive" *ngIf="!loading">
      <table class="table table-striped table-hover align-middle">
        <thead class="bg-primary text-white">
          <tr>
            <th>Título</th>
            <th>URL</th>
            <th>Categoría</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let v of videosFiltrados; trackBy: trackVideo">
            <td>{{ v.titulo }}</td>
            <td class="text-truncate" style="max-width: 280px;">
              <a [href]="v.urlYouTube" target="_blank" rel="noopener noreferrer">{{ v.urlYouTube }}</a>
            </td>
            <td>{{ v.categoriaNombre }}</td>
            <td class="text-end">
              <ng-container *ngIf="authService.role === 'editor'; else userVideoAction">
                <a class="btn btn-link text-dark p-0 me-2" [href]="v.urlYouTube" target="_blank" rel="noopener noreferrer" title="Ver">
                  <i class="bi bi-eye-fill"></i>
                </a>
                <button class="btn btn-link text-dark p-0 me-2" data-bs-toggle="modal" data-bs-target="#modalEditarVideo" (click)="abrirEditar(v)" title="Editar">
                  <i class="bi bi-pencil-fill"></i>
                </button>
                <button class="btn btn-link text-dark p-0" (click)="confirmarEliminar(v)" title="Eliminar">
                  <i class="bi bi-trash3-fill"></i>
                </button>
              </ng-container>
              <ng-template #userVideoAction>
                <a class="btn btn-link text-dark p-0" [href]="v.urlYouTube" target="_blank" rel="noopener noreferrer" title="Ver">
                  <i class="bi bi-eye-fill"></i>
                </a>
              </ng-template>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal Crear Video -->
<div class="modal fade" id="modalCrearVideo" tabindex="-1" aria-hidden="true" *ngIf="authService.role === 'editor'">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Crear Video</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Título</label>
          <input class="form-control" [(ngModel)]="nuevoVideo.titulo">
        </div>
        <div class="mb-3">
          <label class="form-label">URL YouTube</label>
          <input class="form-control" [(ngModel)]="nuevoVideo.urlYouTube">
        </div>
        <div class="mb-3">
          <label class="form-label" for="categoriaCrearVideo">Categoría</label>
          <select id="categoriaCrearVideo" class="form-select" [(ngModel)]="nuevoVideo.categoriaId" aria-label="Seleccionar categoría del video">
            <option [ngValue]="null">Seleccione una categoría</option>
            <option *ngFor="let c of categorias; trackBy: trackCategoria" [ngValue]="c._id">{{ c.nombre }}</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="crearVideo()">Crear</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Editar Video -->
<div class="modal fade" id="modalEditarVideo" tabindex="-1" aria-hidden="true" *ngIf="authService.role === 'editor'">
  <div class="modal-dialog">
    <div class="modal-content" *ngIf="videoEditar as v">
      <div class="modal-header">
        <h5 class="modal-title">Editar Video</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Título</label>
          <input class="form-control" [(ngModel)]="v.titulo">
        </div>
        <div class="mb-3">
          <label class="form-label">URL YouTube</label>
          <input class="form-control" [(ngModel)]="v.urlYouTube">
        </div>
        <div class="mb-3">
          <label class="form-label" for="categoriaEditarVideo">Categoría</label>
          <select id="categoriaEditarVideo" class="form-select" [(ngModel)]="v.categoriaId" aria-label="Seleccionar categoría del video">
            <option [ngValue]="null">Seleccione una categoría</option>
            <option *ngFor="let c of categorias; trackBy: trackCategoria" [ngValue]="c._id">{{ c.nombre }}</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="guardarEdicion()">Guardar</button>
      </div>
    </div>
  </div>
</div>

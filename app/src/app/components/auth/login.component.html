<div class="d-flex align-items-center justify-content-center vh-100 bg-light">
  <div class="card p-4 shadow-lg" style="max-width: 360px; width: 100%;">
    <h3 class="text-center mb-4 fw-semibold">Bienvenido</h3>

    <div *ngIf="errorMessage" class="alert alert-danger mb-3" role="alert">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="mb-3">
        <input type="text" formControlName="username" placeholder="Usuario" class="form-control form-control-lg"
          autocomplete="username" />
        <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
          class="text-warning small mt-1">
          Usuario es requerido
        </div>
      </div>

      <div class="mb-4">
        <input type="password" formControlName="password" placeholder="Contraseña" class="form-control form-control-lg"
          autocomplete="current-password" />
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          class="text-warning small mt-1">
          Contraseña es requerida
        </div>
      </div>

      <button type="submit" class="btn btn-dark w-100 btn-lg fw-semibold" [disabled]="loginForm.invalid || loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>

<div class="card shadow-sm mx-4">
  <div class="card-header bg-primary-subtle text-primary-emphasis d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Logros</h5>
    <button *ngIf="authService.role === 'editor'" class="btn btn-brand" data-bs-toggle="modal"
      data-bs-target="#modalCrearLogro">Crear nuevo logro</button>
  </div>
  <div class="card-body">

    <div class="table-responsive" *ngIf="!loading">
      <table class="table table-striped table-sm">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Icono</th>
            <th class="text-end" *ngIf="authService.role === 'editor'">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let lg of logros; trackBy: trackLogro">
            <td>{{ lg.nombre }}</td>
            <td>
              <img *ngIf="lg.iconoUrl" [src]="lg.iconoUrl" alt="icono" style="height:24px">
            </td>
            <td class="text-end" *ngIf="authService.role === 'editor'">
              <button class="btn btn-link text-dark p-0 me-2" data-bs-toggle="modal" data-bs-target="#modalEditarLogro"
                (click)="abrirEditarLogro(lg)" title="Editar"><i class="bi bi-pencil-fill"></i></button>
              <button class="btn btn-link text-dark p-0" (click)="confirmarEliminarLogro(lg)" title="Eliminar"><i
                  class="bi bi-trash3-fill"></i></button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<div class="modal fade" id="modalCrearLogro" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Crear Logro</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
          id="crearLogroCerrarBtn"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label" for="usuarioSelect">Usuario</label>
          <select id="usuarioSelect" class="form-select" [(ngModel)]="userSeleccionadoId"
            aria-label="Seleccionar usuario para el logro">
            <option [ngValue]="null">Seleccione un usuario</option>
            <option *ngFor="let u of users" [ngValue]="u._id">{{ u.nombreCompleto || u.nombre }}</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input class="form-control" [(ngModel)]="nuevoLogro.nombre">
        </div>
        <div class="mb-3">
          <label class="form-label">Icono (URL)</label>
          <input class="form-control" [(ngModel)]="nuevoLogro.iconoUrl">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="crearLogro()">Crear</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalEditarLogro" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content" *ngIf="logroEditar as lg">
      <div class="modal-header">
        <h5 class="modal-title">Editar Logro</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
          id="editarLogroCerrarBtn"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input class="form-control" [(ngModel)]="lg.nombre">
        </div>
        <div class="mb-3">
          <label class="form-label">Icono (URL)</label>
          <input class="form-control" [(ngModel)]="lg.iconoUrl">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="guardarEdicionLogro()">Guardar</button>
      </div>
    </div>
  </div>
</div>

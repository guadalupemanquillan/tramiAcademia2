<div class="card shadow-sm mx-4">
  <div class="card-header bg-primary-subtle text-primary-emphasis d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Tareas</h5>
  </div>
  <div class="card-body">

    <div class="table-responsive" *ngIf="!loading">
      <table class="table table-striped table-sm">
        <thead>
          <tr>
            <th>Usuario</th>
            <th>Completada</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let t of tareas">
            <td>{{ displayUsuario(t.usuarioId) }}</td>
            <td>
              <span class="badge" [ngClass]="t.completada ? 'bg-success' : 'bg-warning'">
                {{ t.completada ? 'Sí' : 'No' }}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

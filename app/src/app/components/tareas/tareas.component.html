<div class="card shadow-sm mx-4">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="card-title mb-0">Tareas</h5>
      <button *ngIf="auth.role === 'editor'" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalTarea"
        (click)="abrirCrearTarea()">Nueva Tarea</button>
    </div>

    <div class="table-responsive" *ngIf="!loading">
      <table class="table table-striped table-sm">
        <thead>
          <tr>
            <th>Usuario</th>
            <th>Completada</th>
            <th class="text-end" *ngIf="auth.role === 'editor'">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let t of tareas">
            <td>{{ displayUsuario(t.usuarioId) }}</td>
            <td>
              <span class="badge" [ngClass]="t.completada ? 'bg-success' : 'bg-warning'">
                {{ t.completada ? 'Sí' : 'No' }}
              </span>
            </td>
            <td class="text-end" *ngIf="auth.role === 'editor'">
              <button class="btn btn-sm btn-outline-primary me-1" data-bs-toggle="modal" data-bs-target="#modalTarea"
                (click)="abrirEditarTarea(t)">Editar</button>
              <button class="btn btn-sm btn-outline-danger" (click)="confirmarEliminar(t)">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal único para crear/editar -->
<div class="modal fade" id="modalTarea" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ modoForm === 'crear' ? 'Crear Tarea' : 'Editar Tarea' }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Usuario ID</label>
          <input class="form-control" [(ngModel)]="tareaForm.usuarioId">
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" [(ngModel)]="tareaForm.completada" id="chkCompletada">
          <label class="form-check-label" for="chkCompletada">Completada</label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="guardarTarea()">
          {{ modoForm === 'crear' ? 'Crear' : 'Guardar' }}
        </button>
      </div>
    </div>
  </div>
</div>

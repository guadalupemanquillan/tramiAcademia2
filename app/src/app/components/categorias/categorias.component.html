<div class="card shadow-sm mx-4">
  <div class="card-header bg-primary-subtle text-primary-emphasis d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Categorías</h5>
    <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#modalCrearCategoria">Crear nueva</button>
  </div>
  <div class="card-body">
    <div class="row g-2 mb-3">
      <div class="col-8">
        <input type="text" class="form-control" placeholder="Buscar por nombre" [(ngModel)]="categoriasNombreFiltro">
      </div>
      <div class="col-4 d-grid">
        <button class="btn btn-outline-secondary" (click)="cargarCategorias()">Buscar</button>
      </div>
    </div>
    <div class="table-responsive" *ngIf="categoriasResp.items.length; else vacio">
      <table class="table table-striped table-sm">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Padre</th>
            <th>Empresa</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let c of categoriasResp.items; trackBy: trackCategoria">
            <td>{{ c.nombre }}</td>
            <td>{{ categoriaNombrePorId(c.categoriaPadre) }}</td>
            <td>{{ empresaNombrePorId(c.empresaId) }}</td>
            <td class="text-end">
              <ng-container *ngTemplateOutlet="accionesCategoria; context: {$implicit: c}"></ng-container>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <ng-template #vacio>
      <div class="text-muted small">No hay categorías.</div>
    </ng-template>
    <nav *ngIf="categoriasResp" class="d-flex justify-content-between align-items-center mt-2">
      <span>Pagina {{ categoriasResp.page }} / {{ categoriasResp.totalPages }}</span>
      <div class="btn-group">
        <button class="btn btn-outline-secondary" (click)="cambiarPaginaCategorias(categoriasResp.page - 1)"
          [disabled]="categoriasResp.page <= 1">Anterior</button>
        <button class="btn btn-outline-secondary" (click)="cambiarPaginaCategorias(categoriasResp.page + 1)"
          [disabled]="categoriasResp.page >= categoriasResp.totalPages">Siguiente</button>
      </div>
    </nav>
  </div>
</div>
<ng-template #accionesCategoria let-cat>
  <div class="d-inline-flex align-items-center gap-2">
    <button class="btn btn-link text-dark p-0" data-bs-toggle="modal" data-bs-target="#modalEditarCategoria"
      (click)="abrirEditarCategoria(cat)" title="Editar">
      <i class="bi bi-pencil-fill"></i>
    </button>
    <button class="btn btn-link text-dark p-0" (click)="confirmarEliminarCategoria(cat)" title="Eliminar">
      <i class="bi bi-trash3-fill"></i>
    </button>
  </div>
</ng-template>
<div class="modal fade" id="modalCrearCategoria" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Crear Categoría</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
          id="crearCategoriaCerrarBtn"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input class="form-control" [(ngModel)]="nuevaCategoria.nombre">
        </div>
        <div class="mb-3">
          <label class="form-label">Categoría Padre</label>
          <select class="form-select" [(ngModel)]="nuevaCategoria.categoriaPadre">
            <option [ngValue]="null">Ninguna</option>
            <option *ngFor="let op of todasCategorias" [ngValue]="op._id">{{ op.nombre }}</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Empresa</label>
          <select class="form-select" [(ngModel)]="nuevaCategoria.empresaId">
            <option [ngValue]="null">Sin empresa</option>
            <option *ngFor="let e of empresas" [ngValue]="e._id">{{ e.nombre }}</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Jerarquía</label>
          <input type="number" class="form-control" [(ngModel)]="nuevaCategoria.jerarquia">
          <small class="text-muted">0 es la jerarquía más alta.</small>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="crearCategoria()">Crear</button>
      </div>
    </div>
  </div>
</div>
<div class="modal fade" id="modalEditarCategoria" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content" *ngIf="categoriaEditar as c">
      <div class="modal-header">
        <h5 class="modal-title">Editar Categoría</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
          id="editarCategoriaCerrarBtn"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input class="form-control" [(ngModel)]="c.nombre">
        </div>
        <div class="mb-3">
          <label class="form-label">Categoría Padre</label>
          <select class="form-select" [(ngModel)]="c.categoriaPadre">
            <option [ngValue]="null">Ninguna</option>
            <option *ngFor="let op of todasCategorias" [ngValue]="op._id">{{ op.nombre }}</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Empresa</label>
          <select class="form-select" [(ngModel)]="c.empresaId">
            <option [ngValue]="null">Sin empresa</option>
            <option *ngFor="let e of empresas" [ngValue]="e._id">{{ e.nombre }}</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Jerarquía</label>
          <input type="number" class="form-control" [(ngModel)]="c.jerarquia">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="guardarEdicionCategoria()">Guardar</button>
      </div>
    </div>
  </div>
</div>

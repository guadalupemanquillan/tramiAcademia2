<div class="card shadow-sm mx-4">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="card-title mb-0">Lista de tareas</h5>
      <button *ngIf="authService.role === 'editor'" class="btn btn-primary" data-bs-toggle="modal"
        data-bs-target="#modalCrearTodo">
        Nuevo Todo
      </button>
    </div>

    <div class="row g-3">
      <!-- Checklist tiene tests, videos, y tareas base -->
      <h6 class="mb-2">-</h6>
      <div *ngIf="checklist.length === 0" class="text-muted small">Sin tareas en checklist.</div>
      <ul class="list-group">
        <li *ngFor="let c of checklist; trackBy: trackCode"
          class="list-group-item d-flex justify-content-between align-items-center">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" [checked]="c.completed" (change)="toggleChecklist(c)"
              [id]="'chk-' + c.code">
            <label class="form-check-label" [for]="'chk-' + c.code">
              {{ c.title }} <span class="badge bg-secondary ms-2">{{ c.type }}</span>
            </label>
          </div>
        </li>
      </ul>

    </div>
  </div>
</div>
<!-- Crear Todo -->
<div class="modal fade" id="modalCrearTodo" tabindex="-1" aria-hidden="true" *ngIf="authService.role === 'editor'">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Crear Todo</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Título</label>
          <input class="form-control" [(ngModel)]="nuevoTodo.titulo">
        </div>
        <div class="mb-3">
          <label class="form-label">Categoría</label>
          <select class="form-select" [(ngModel)]="nuevoTodo.categoriaId">
            <option [ngValue]="null">Sin categoría</option>
            <option *ngFor="let c of categorias" [ngValue]="c._id">{{ c.nombre }}</option>
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label">Tareas del Todo</label>
          <div class="input-group mb-2">
            <input class="form-control" #tname placeholder="Nombre de tarea (video/test/otro)">
            <button type="button" class="btn btn-outline-primary" (click)="addTareaBaseFromInput(tname)">Agregar</button>
          </div>
          <ul class="list-group">
            <li *ngFor="let tb of (nuevoTodo.tareasBase || []); let i=index" class="list-group-item d-flex justify-content-between">
              <span>{{ tb.nombreTarea }}</span>
              <button type="button" class="btn btn-sm btn-outline-danger" (click)="removeTareaBase(i)">Quitar</button>
            </li>
          </ul>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="crearTodo()">Crear</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Editar Todo -->
<div class="modal fade" id="modalEditarTodo" tabindex="-1" aria-hidden="true" *ngIf="authService.role === 'editor'">
  <div class="modal-dialog">
    <div class="modal-content" *ngIf="todoEditar as t">
      <div class="modal-header">
        <h5 class="modal-title">Editar Todo</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Título</label>
          <input class="form-control" [(ngModel)]="t.titulo">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="guardarEdicion()">Guardar</button>
      </div>
    </div>
  </div>
</div>

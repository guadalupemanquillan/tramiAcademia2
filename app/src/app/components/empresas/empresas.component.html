<div class="row g-3 mx-4">
  <!-- Encabezado de acciones: solo en modo lista -->
  <div class="col-12" *ngIf="viewMode === 'list'">
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="row g-3 align-items-center">
          <div class="col-12 col-lg-7 d-flex align-items-center gap-3">
            <h5 class="card-title mb-0">Buscar empresa</h5>
            <div class="position-relative flex-grow-1">
              <input type="text" class="form-control" placeholder="Buscar por nombre" [(ngModel)]="empresasFiltro" (input)="onBuscarInput()" (focus)="onBuscarInput()" (keydown)="onBuscarKeyDown($event)" (blur)="mostrarSugerencias=false">
              <div class="dropdown-menu show w-100" *ngIf="mostrarSugerencias && sugerencias.length">
                <button type="button" class="dropdown-item" *ngFor="let sug of sugerencias; let i = index" [class.active]="i === highlightedIndex" (mousedown)="seleccionarEmpresaSug(sug)">{{ sug.nombre }}</button>
              </div>
            </div>
            <div class="ms-auto">
              <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#modalEmpresa" (click)="abrirCrear()">Nueva Empresa</button>
            </div>
          </div>
          <div class="col-12 col-lg-5">
            <div class="row g-2">
              <div class="col-12">
                <div class="bg-light border rounded-3 px-3 py-2">
                  <span class="fw-semibold">Última empresa creada: </span>
                  <span>{{ ultimaEmpresaNombre }}</span>
                </div>
              </div>
              <div class="col-12">
                <div class="bg-light border rounded-3 px-3 py-2">
                  <span class="fw-semibold">Total empresas: </span>
                  <span>{{ totalEmpresas }}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-12" *ngIf="viewMode === 'list'">
    <div class="card shadow-sm">
      <div class="card-header bg-primary-subtle text-primary-emphasis">
        <h5 class="mb-0">Listado de empresas</h5>
      </div>
      <div class="card-body">
        <div class="table-responsive" *ngIf="!loading">
          <table class="table table-striped table-sm table-hover">
            <thead>
              <tr>
                <th class="w-25">Nombre</th>
                <th class="w-25">Imagen</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let e of empresasFiltradas" class="cursor-pointer">
                <td class="w-25 align-middle"><div class="text-truncate">{{ e.nombre }}</div></td>
                <td class="w-25">
                  <div class="ratio ratio-slim bg-light rounded d-flex align-items-center justify-content-center">
                    <img *ngIf="e.imagen" [src]="e.imagen" alt="imagen" class="w-100 h-100 object-fit-contain">
                  </div>
                </td>
                <td class="text-end">
                  <button class="btn btn-link text-dark p-0 me-2" title="Detalles" (click)="$event.stopPropagation(); openDetalleModal(e)"><i class="bi bi-eye-fill"></i></button>
                  <button class="btn btn-link text-dark p-0 me-2" title="Editar" data-bs-toggle="modal" data-bs-target="#modalEmpresa" (click)="$event.stopPropagation(); abrirEditar(e)"><i class="bi bi-pencil-fill"></i></button>
                  <button class="btn btn-link text-dark p-0" title="Eliminar" (click)="$event.stopPropagation(); confirmarEliminarEmpresa(e)"><i class="bi bi-trash3-fill"></i></button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <!-- Modal Crear / Editar -->
  <div class="modal fade" id="modalEmpresa" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content" *ngIf="empresaForm">
        <div class="modal-header">
          <h5 class="modal-title">{{ modoForm === 'crear' ? 'Crear Empresa' : 'Editar Empresa' }}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input class="form-control" [(ngModel)]="empresaForm.nombre">
          </div>
          <div class="mb-3">
            <label class="form-label">Imagen (URL)</label>
            <input class="form-control" [(ngModel)]="empresaForm.imagen">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" (click)="guardarForm()">{{ modoForm === 'crear' ? 'Crear' :
            'Guardar' }}</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Modal Detalle Empresa -->
  <div class="modal fade" id="modalImagenEmpresa" tabindex="-1" aria-hidden="true" [class.show]="modalEmpresa" [style.display]="modalEmpresa ? 'block' : 'none'" (click)="onModalBackdropClick($event)">
    <div class="modal-dialog modal-dialog-centered modal-sm" (click)="$event.stopPropagation()">
      <div class="modal-content">
        <div class="modal-header bg-primary-subtle text-primary-emphasis">
          <h5 class="modal-title mb-0">Detalle Empresa</h5>
          <button type="button" class="btn-close" (click)="modalEmpresa=null" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div *ngIf="modalEmpresa as emp">
            <div class="mb-2 bg-light border rounded-3 px-3 py-2"><span class="fw-semibold">Nombre:</span> {{ emp.nombre }}</div>
            <div class="bg-light border rounded-3 empresa-detail-image p-2" *ngIf="emp.imagen">
              <img [src]="emp.imagen" alt="imagen" class="img-fluid h-100 w-100 object-fit-contain">
            </div>
            <div class="d-grid gap-2 mt-3">
              <button class="btn btn-brand" (click)="modalEmpresa=null">Volver a listado</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop fade show" *ngIf="modalEmpresa"></div>

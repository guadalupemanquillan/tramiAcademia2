<div class="card shadow-sm mx-4">
  <div class="card-header bg-primary-subtle text-primary-emphasis d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Usuarios</h5>
    <button class="btn btn-brand" (click)="openModal()" data-bs-toggle="modal" data-bs-target="#modalCrearUsuario">Nuevo usuario</button>
  </div>
  <div class="card-body">

    <!-- Modal crear usuario -->
    <div class="modal fade" id="modalCrearUsuario" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Crear usuario</h5>
            <button type="button" class="btn-close" id="crearUsuarioCerrarBtn" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form (ngSubmit)="createUser()">
            <div class="modal-body">
              <div class="row g-3">
                <div class="col-sm-4">
                  <label class="form-label">Nombre</label>
                  <input class="form-control" [(ngModel)]="newUser.nombre" name="nombre" placeholder="Nombre" />
                </div>
                <div class="col-sm-8">
                  <label class="form-label">Nombre completo</label>
                  <input class="form-control" [(ngModel)]="newUser.nombreCompleto" name="nombreCompleto" placeholder="Nombre completo" />
                </div>
                <div class="col-sm-3">
                  <label class="form-label" for="roles">Rol</label>
                  <select id="roles" class="form-select" [(ngModel)]="newUser.roles" name="roles" title="Rol">
                    <option value="usuario">usuario</option>
                    <option value="editor">editor</option>
                  </select>
                </div>
                <div class="col-sm-6">
                  <label class="form-label" for="empresaId">Empresa</label>
                  <select id="empresaId" class="form-select" [(ngModel)]="newUser.empresaId" name="empresaId" title="Empresa">
                    <option value="">Sin empresa</option>
                    <option *ngFor="let e of (empresas$ | async)" [value]="e._id">{{ e.nombre }}</option>
                  </select>
                </div>
                <div class="col-sm-3">
                  <label class="form-label">Contraseña</label>
                  <input class="form-control" [(ngModel)]="newUser.password" name="password" placeholder="Contraseña" type="password" />
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <div class="text-danger small me-auto" *ngIf="errorMsg">{{ errorMsg }}</div>
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" [disabled]="isSubmitting">Cancelar</button>
              <button class="btn btn-primary" type="submit" [disabled]="isSubmitting">Crear</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-striped table-sm">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Rol</th>
            <th>Empresa</th>
            <th class="text-end">ID</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let u of (users$ | async)">
            <td>{{ u.nombreCompleto || u.nombre }}</td>
            <td>{{ u.roles || 'usuario' }}</td>
            <td>{{ u.empresaId || '—' }}</td>
            <td class="text-end">{{ u._id }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

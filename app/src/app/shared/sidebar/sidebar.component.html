<aside class="d-flex flex-column vh-100 bg-light p-3" style="width: 300px;">
  <!-- Menú -->
  <nav class="nav nav-pills flex-column mb-3">
    <a *ngFor="let item of filteredMenu"
       class="nav-link d-flex align-items-center"
       [routerLink]="item.route"
       routerLinkActive="active"
       #rla="routerLinkActive"
       [routerLinkActiveOptions]="{ exact: true }"
       [ngClass]="{ 'text-dark': !rla.isActive, 'text-white': rla.isActive }">
      <i class="bi me-2" [ngClass]="item.icon"></i>
      <span>{{ item.label }}</span>
    </a>
  </nav>

  <hr class="mt-auto">

  <!-- Información de sesión -->
  <div class="small text-muted mt-4 pt-2">
    <div>Sesión activa</div>
    <div>Rol: <strong>{{ role || 'usuario' }}</strong></div>
  </div>
</aside>

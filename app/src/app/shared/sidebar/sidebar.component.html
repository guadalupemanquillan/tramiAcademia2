<aside class="sidebar d-flex flex-column min-vh-100 bg-light p-3">
  <!-- Menú -->
  <nav class="nav nav-pills flex-column mb-3">
    <a *ngFor="let item of filteredMenu; let i = index" class="nav-link d-flex align-items-center" [routerLink]="item.route"
      routerLinkActive="active" #rla="routerLinkActive" [routerLinkActiveOptions]="{ exact: true }">
      <i class="bi me-2" [ngClass]="item.icon"></i>
      <span>{{ item.label }}</span>
    </a>
    <!-- Separador sutil entre grupos (tras el 3er item) -->
    <hr class="nav-separator" *ngIf="filteredMenu.length > 4">
  </nav>
  <hr class="mt-auto">
  <!-- Información de sesión -->
  <div class="small text-muted mt-4 pt-2">
    <div>Sesión activa</div>
    <div>Rol: <strong>{{ role || 'usuario' }}</strong></div>
  </div>
</aside>
